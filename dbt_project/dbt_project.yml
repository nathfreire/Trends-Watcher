# dbt_project.yml
name: 'proyecto_dbt'
version: '1.0.0'
config-version: 2

profile: 'mi_db_profile' # Debe coincidir con el nombre en profiles.yml

model-paths: ["models"] #model-paths le dice a dbt dónde están tus archivos de código .sql (tus scripts de staging, hechos y dimensiones)

on-run-start:
  - "INSTALL delta;"
  - "LOAD delta;"

models:
  proyecto_dbt:
    # Por defecto, todo en staging serán VISTAS en DuckDB (no duplica datos)
    staging:
      +materialized: view
    # Todo lo que esté en marts se guardará como TABLAS físicas
    marts:
      # Tuve que poner formato tabla/incremental para que dbt gestione los duplicados
      # dbt  puede asegurar consistencia
      # atomicidad y rollback también, y de forma nativa
      +materialized: incremental
      +incremental_strategy: merge  # <-- ¡MERGE!

vars:
  ruta_delta_bruto: "C:/010_/Trends-Watcher/output/bronze/delta_bruto"
## Esta variable de entorno se ha declarado aquí pero aparece en
## source.yml (aquí en teoria debería shaber sido como fuente pero, sólo va a ser como documentación
### porque el scrip .sql que crea la view espejo sólo puede escuchar con delta_scan() , y no source() porque si uso esto
### no corre, a dbt_project.yml debido a 
### impedimento técnido de Duckdb)
